<title>Partial Prompt Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: single annotation column — sample labels, prompt, stimulus, questions; profile screen first, summary last */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78; --line:#d6dde4;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --warn:#a2541b; --warn-soft:#f8ebe1;
  --cA:#2d6a45; --cB:#5a5aa0; --cC:#a2541b; --cD:#8a3b5c; --cE:#5d6b78;
  --display:"Fraunces", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111820; --surface:#18222c; --ink:#e4eaf0; --muted:#94a3b1; --line:#2c3a47;
  --accent:#7db4dc; --accent-soft:#1c3346; --warn:#e3a173; --warn-soft:#3a2a1f;
  --cA:#79c296; --cB:#a9a9e6; --cC:#e3a173; --cD:#e08cb0; --cE:#94a3b1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111820; --surface:#18222c; --ink:#e4eaf0; --muted:#94a3b1; --line:#2c3a47;
  --accent:#7db4dc; --accent-soft:#1c3346; --warn:#e3a173; --warn-soft:#3a2a1f;
  --cA:#79c296; --cB:#a9a9e6; --cC:#e3a173; --cD:#e08cb0; --cE:#94a3b1; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
.intro{color:var(--muted);margin:0;max-width:62ch}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress span{width:22px;height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.cur{background:var(--accent);opacity:.45}
.toggle{font:500 13px var(--body);color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:22px}
.labels{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:-8px}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:3px 9px;border-radius:4px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.tag i{font-style:normal;color:var(--muted)}
.tag.cat{border-color:currentColor;background:transparent}
.cat-A{color:var(--cA)} .cat-B{color:var(--cB)} .cat-C{color:var(--cC)} .cat-D{color:var(--cD)} .cat-E{color:var(--cE)}
.unm{font-size:13px;color:var(--muted);margin:-10px 0 0}
.unm b{font-weight:500;color:var(--ink)}
.prompt{display:flex;flex-direction:column;gap:4px}
.prompt .lbl{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.prompt q{font-family:var(--display);font-size:24px;font-weight:500;quotes:"“" "”"}
.stim{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);line-height:0}
.stim svg{width:100%;height:auto;display:block}
.stim.marking{cursor:crosshair;outline:3px solid var(--warn);outline-offset:-3px}
.stim .hint{position:absolute;left:10px;bottom:10px;line-height:1.3;background:var(--warn-soft);color:var(--warn);font:500 12px var(--body);padding:5px 9px;border-radius:5px}

.q{display:flex;flex-direction:column;gap:10px}
.q h3{font:600 15px var(--body);margin:0}
.q .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);line-height:1.25;background:var(--surface)}
.opt label b{font:600 17px var(--mono);color:var(--ink)}
.opt input:checked + label{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .opt{flex:1 1 120px}
.row .opt label{min-height:44px;font-size:13.5px;color:var(--ink)}
.marks{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label.f{font:600 14px var(--body)}
.field .sub{font-size:13px;color:var(--muted);margin:-2px 0 2px}
input[type=text]{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;max-width:280px}
button{font:500 14px var(--body);border-radius:7px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.link{border:none;padding:0;background:none;color:var(--accent);text-decoration:underline;font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav .right{margin-left:auto}

.legend{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend div{display:flex;gap:10px;align-items:baseline}
.legend b{font:600 12px var(--mono);min-width:22px}

table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:140px}
th{font:500 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
pre{font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:12px;overflow:auto;max-height:300px;margin:0}
@media (max-width:480px){.opt label{font-size:11px;min-height:64px}.prompt q{font-size:21px}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.opt label,button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Pilot · 12 samples · ~5 min</div>
    <h1>Does the image match the text?</h1>
    <p class="intro">Each sample shows a short text and an image. Imagine you typed the text into an image generator and got this image back. Judge only how well the image matches what the text asks for, not how good it looks.</p>
  </header>

  <div class="topbar">
    <div class="progress" id="progress" aria-label="Progress"></div>
    <label class="toggle"><input type="checkbox" id="showLabels" checked> Show sample labels</label>
  </div>

  <main id="app"></main>
</div>

<script>
/* ================= Stimuli (placeholder illustrations — replace with real generations / inpainted minimal pairs) ================= */
const S = (inner, bg = "") => `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img">${bg}${inner}</svg>`;

const roomBg = `
  <rect width="400" height="260" fill="#d9d2c7"/><rect width="400" height="150" fill="#cfc7bb"/>
  <rect x="250" y="28" width="96" height="74" fill="#e7e1d6" stroke="#b9b0a2" stroke-width="3"/>
  <line x1="298" y1="28" x2="298" y2="102" stroke="#b9b0a2" stroke-width="3"/>
  <polygon points="20,160 380,160 400,200 0,200" fill="#8c5a36"/>
  <rect y="200" width="400" height="14" fill="#6e4528"/>
  <rect x="30" y="214" width="14" height="46" fill="#6e4528"/><rect x="356" y="214" width="14" height="46" fill="#6e4528"/>`;

const grassBg = `
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8d6"/><stop offset="1" stop-color="#c9e1f2"/></linearGradient></defs>
  <rect width="400" height="260" fill="url(#sky)"/>
  <circle cx="330" cy="50" r="22" fill="#f7e08a"/>
  <g fill="#fff" opacity=".9"><ellipse cx="90" cy="52" rx="34" ry="12"/><ellipse cx="114" cy="44" rx="22" ry="12"/></g>
  <path d="M0 150 C 80 138 160 146 240 140 C 300 136 360 142 400 138 L400 260 L0 260 Z" fill="#6aa04a"/>
  <rect y="180" width="400" height="80" fill="#5b9140"/>
  <rect x="58" y="96" width="8" height="52" fill="#6a4a30"/><circle cx="62" cy="88" r="24" fill="#3f7a35"/>`;

const apple = (cx, cy, s = 1, body = "#c62f2a", hi = "#e8746b") => `
  <g transform="translate(${cx} ${cy}) scale(${s})">
    <ellipse cy="22" rx="30" ry="6" fill="#000" opacity=".18"/>
    <path d="M0 -18 C 22 -32 40 -10 34 8 C 30 24 14 30 0 24 C -14 30 -30 24 -34 8 C -40 -10 -22 -32 0 -18 Z" fill="${body}"/>
    <ellipse cx="-14" cy="-6" rx="7" ry="10" fill="${hi}" opacity=".55"/>
    <path d="M0 -18 C 1 -28 3 -34 6 -38" stroke="#4d3220" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M6 -34 C 16 -42 26 -38 28 -32 C 18 -28 10 -30 6 -34 Z" fill="#4f8a3a"/>
  </g>`;
const pear = (cx, cy) => `
  <g transform="translate(${cx} ${cy})">
    <ellipse cy="34" rx="30" ry="6" fill="#000" opacity=".18"/>
    <ellipse cy="12" rx="30" ry="26" fill="#c3c24a"/><ellipse cy="-16" rx="16" ry="22" fill="#c3c24a"/>
    <ellipse cx="-10" cy="6" rx="7" ry="12" fill="#e0df8a" opacity=".6"/>
    <path d="M0 -36 C 0 -44 2 -50 6 -54" stroke="#4d3220" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>`;
const chair = (x, y, s = 1) => `
  <g transform="translate(${x} ${y}) scale(${s})" fill="#9b6a3f" stroke="#6e4728" stroke-width="2">
    <rect x="10" y="0" width="10" height="110"/><rect x="76" y="0" width="10" height="110"/>
    <rect x="10" y="4" width="76" height="10"/><rect x="10" y="28" width="76" height="8"/>
    <rect x="0" y="62" width="98" height="14"/>
    <rect x="4" y="76" width="9" height="56"/><rect x="86" y="76" width="9" height="56"/>
    <rect x="36" y="76" width="8" height="40"/><rect x="56" y="76" width="8" height="40"/>
  </g>`;
const cone = (x, y) => `
  <g transform="translate(${x} ${y})">
    <rect x="-34" y="0" width="68" height="10" rx="2" fill="#d4541c"/>
    <polygon points="-24,0 24,0 6,-78 -6,-78" fill="#ef6a24"/>
    <polygon points="-17,-28 17,-28 13,-44 -13,-44" fill="#f4f1ea"/>
    <polygon points="-10,-56 10,-56 8,-66 -8,-66" fill="#f4f1ea"/>
  </g>`;

const SCENES = {
  greenApple: S(apple(200, 160, 1.15, "#7fb23c", "#c6e08a"), roomBg),
  redApple:   S(apple(200, 160, 1.15), roomBg),
  chair:      S(chair(160, 88), grassBg),
  twoChairs:  S(chair(80, 92, .95) + chair(240, 88), grassBg),
  coffeeTop:  S(`
    <rect width="400" height="260" fill="#c9a679"/>
    ${[40,95,150,205].map(y=>`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#b08d60" stroke-width="2"/>`).join("")}
    <rect x="252" y="114" width="58" height="30" rx="15" fill="none" stroke="#f3f0ea" stroke-width="12"/>
    <circle cx="200" cy="130" r="66" fill="#000" opacity=".12" transform="translate(6 6)"/>
    <circle cx="200" cy="130" r="66" fill="#f3f0ea"/>
    <circle cx="200" cy="130" r="54" fill="#5a3620"/>
    <ellipse cx="186" cy="116" rx="18" ry="10" fill="#a0714c" opacity=".55"/>`),
  birthdayCake: S(`
    <ellipse cx="200" cy="196" rx="112" ry="20" fill="#eee8dd"/>
    <rect x="118" y="120" width="164" height="72" fill="#f1c9d3"/>
    <ellipse cx="200" cy="192" rx="82" ry="14" fill="#f1c9d3"/>
    <ellipse cx="200" cy="120" rx="82" ry="16" fill="#fbeef1"/>
    <path d="M118 120 q10 22 20 0 q10 18 20 0 q10 24 20 0 q10 16 20 0 q10 22 20 0 q10 18 20 0 q10 22 20 0 q10 16 22 0" fill="#fbeef1"/>
    ${[160,186,212,238].map((x,i)=>`<rect x="${x-3}" y="${86+(i%2)*6}" width="7" height="${30-(i%2)*6}" fill="${["#6fa8d6","#f7e08a","#79c296","#e08cb0"][i]}"/>
      <ellipse cx="${x}" cy="${78+(i%2)*6}" rx="5" ry="9" fill="#f6b23c"/><ellipse cx="${x}" cy="${81+(i%2)*6}" rx="2.4" ry="4" fill="#fff4c2"/>`).join("")}`, roomBg),
  laptopDesk: S(`
    <rect width="400" height="260" fill="#cfd6dc"/><rect y="168" width="400" height="92" fill="#7d6750"/>
    <g transform="translate(70 0)">
      <rect x="-6" y="150" width="60" height="10" rx="3" fill="#2b2f33"/>
      <line x1="24" y1="150" x2="40" y2="78" stroke="#2b2f33" stroke-width="6"/>
      <line x1="40" y1="78" x2="76" y2="70" stroke="#2b2f33" stroke-width="6"/>
      <path d="M62 66 L104 60 L96 92 Z" fill="#e2b33b"/>
    </g>
    <polygon points="140,190 286,190 304,214 122,214" fill="#9aa3ab"/>
    <rect x="150" y="96" width="126" height="94" rx="4" fill="#3a4148"/>
    <rect x="158" y="104" width="110" height="78" fill="#7fb0d6"/>
    <g transform="translate(320 150)"><rect width="40" height="48" rx="4" fill="#e9eef2"/>
      <path d="M40 12 h10 a8 8 0 0 1 0 22 h-10" fill="none" stroke="#e9eef2" stroke-width="6"/>
      <ellipse cx="20" cy="2" rx="20" ry="4" fill="#5a3620"/></g>`),
  catInBox: S(`
    <rect width="400" height="260" fill="#dfe5e1"/><rect y="200" width="400" height="60" fill="#b8a58c"/>
    <g transform="translate(200 132)">
      <polygon points="-38,-34 -26,-72 -12,-38" fill="#7d8287"/><polygon points="38,-34 26,-72 12,-38" fill="#7d8287"/>
      <polygon points="-32,-38 -26,-60 -18,-40" fill="#e6b3b3"/><polygon points="32,-38 26,-60 18,-40" fill="#e6b3b3"/>
      <ellipse cy="-10" rx="46" ry="40" fill="#7d8287"/>
      <ellipse cx="-16" cy="-16" rx="7" ry="9" fill="#e5d36a"/><ellipse cx="16" cy="-16" rx="7" ry="9" fill="#e5d36a"/>
      <ellipse cx="-16" cy="-16" rx="2.5" ry="8" fill="#1d1d1d"/><ellipse cx="16" cy="-16" rx="2.5" ry="8" fill="#1d1d1d"/>
      <polygon points="-5,2 5,2 0,8" fill="#d9878a"/>
    </g>
    <polygon points="110,140 290,140 330,118 150,118" fill="#c99a62"/>
    <rect x="110" y="140" width="180" height="90" fill="#b98a52"/>
    <polygon points="290,140 330,118 330,206 290,230" fill="#a77843"/>
    <polygon points="110,140 70,166 150,170 180,140" fill="#d3a873"/>`),
  coneTable: S(apple(140, 162, .9) + cone(250, 190), roomBg),
  sailboatFar: S(`
    <defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc3df"/><stop offset="1" stop-color="#e3eef5"/></linearGradient></defs>
    <rect width="400" height="260" fill="url(#sea)"/>
    <rect y="150" width="400" height="110" fill="#3f78a2"/>
    ${[170,190,214,240].map((y,i)=>`<line x1="${20+i*30}" y1="${y}" x2="${140+i*40}" y2="${y}" stroke="#6b9cc0" stroke-width="2"/><line x1="${230-i*10}" y1="${y+8}" x2="${360-i*6}" y2="${y+8}" stroke="#6b9cc0" stroke-width="2"/>`).join("")}
    <g transform="translate(318 146)"><polygon points="-7,0 7,0 5,3 -5,3" fill="#2b2f33"/><polygon points="0,-12 0,-1 6,-1" fill="#fff"/><line x1="0" y1="-12" x2="0" y2="0" stroke="#2b2f33" stroke-width="1"/></g>`),
  applePear: S(apple(160, 162) + pear(250, 150), roomBg),
};

/* ================= Taxonomy ================= */
const CATS = {
  A: "Forced completion",
  B: "Presupposed content",
  C: "Optional addition",
  D: "Salience",
  E: "Control",
};

const ITEMS = [
  { id:"S01", prompt:"an apple", scene:"greenApple", cat:"A", sub:"Unspecified attribute", theme:"Food",
    unmentioned:"color (green), size, background" },
  { id:"S02", prompt:"a chair on the grass", scene:"chair", cat:"A", sub:"Background / scene", theme:"Outdoor · furniture",
    unmentioned:"sky, sun, cloud, tree" },
  { id:"S03", prompt:"a cup of coffee", scene:"coffeeTop", cat:"A", sub:"Viewpoint / framing", theme:"Food",
    unmentioned:"top-down view, wooden surface" },
  { id:"S04", prompt:"a birthday cake", scene:"birthdayCake", cat:"B", sub:"Implied by the text", theme:"Food · events",
    unmentioned:"lit candles (implied by 'birthday'), plate, table" },
  { id:"S05", prompt:"a laptop on a desk", scene:"laptopDesk", cat:"C", sub:"Typical context object", theme:"Office",
    unmentioned:"desk lamp, coffee mug" },
  { id:"S06", prompt:"an apple", scene:"applePear", cat:"C", sub:"Competing object", theme:"Food",
    unmentioned:"a pear of similar size and salience", pairedWith:"S11" },
  { id:"S07", prompt:"a chair on the grass", scene:"twoChairs", cat:"C", sub:"Extra instance", theme:"Outdoor · furniture",
    unmentioned:"a second chair" },
  { id:"S08", prompt:"a cat and a box", scene:"catInBox", cat:"C", sub:"Added relation", theme:"Animals",
    unmentioned:"the relation 'cat inside the box'" },
  { id:"S09", prompt:"an apple on a table", scene:"coneTable", cat:"C", sub:"Incongruous object", theme:"Food · indoor",
    unmentioned:"a traffic cone" },
  { id:"S10", prompt:"a sailboat", scene:"sailboatFar", cat:"D", sub:"Subject too small", theme:"Outdoor · vehicles",
    unmentioned:"nothing added; the sea and sky dominate the frame" },
  { id:"S11", prompt:"a red apple on a wooden table", scene:"applePear", cat:"C", sub:"Competing object · detailed prompt", theme:"Food",
    unmentioned:"a pear (same image as S06, more specific text)", pairedWith:"S06" },
  { id:"S12", prompt:"a banana", scene:"redApple", cat:"E", sub:"Attention check", theme:"Food",
    unmentioned:"the requested object is absent; expected rating 1" },
];

const LIKERT = [[1,"Does not match"],[2,"Poorly"],[3,"Partly"],[4,"Mostly"],[5,"Fully matches"]];
const CONF = [["low","Not sure"],["mid","Fairly sure"],["high","Very sure"]];
const PROFILE = [
  { key:"english", label:"How would you describe your English?", opts:[["native","Native"],["fluent","Fluent"],["intermediate","Intermediate"]] },
  { key:"t2i", label:"How often do you use AI image generators?", sub:"For example Midjourney, DALL·E, Stable Diffusion, Imagen.", opts:[["never","Never"],["sometimes","A few times"],["regularly","Regularly"]] },
];

/* ================= State ================= */
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
let order = shuffle(ITEMS.map((_,i)=>i));
let step = -1;                                 // -1 = profile, 0..n-1 = samples, n = summary
const annot = { id:"", english:null, t2i:null };
const R = ITEMS.map(it => ({ id:it.id, prompt:it.prompt, category:CATS[it.cat], subcategory:it.sub, theme:it.theme,
  rating:null, unwanted:null, marks:[], confidence:null, position:null }));

const app = document.getElementById("app");
const showLabels = document.getElementById("showLabels");
showLabels.addEventListener("change", render);

const radios = (name, opts, val, cls, fmt) => `<div class="${cls}" role="radiogroup">` + opts.map(([v,l]) => `
  <div class="opt"><input type="radio" id="${name}-${v}" name="${name}" value="${v}" ${String(val)===String(v)?"checked":""}>
  <label for="${name}-${v}">${fmt(v,l)}</label></div>`).join("") + `</div>`;

function renderProgress(){
  const n = ITEMS.length;
  document.getElementById("progress").innerHTML = Array.from({length:n},(_,i)=>
    `<span class="${i<step?"done":i===step?"cur":""}"></span>`).join("");
}

function render(){
  renderProgress();
  if (step === -1) return renderProfile();
  if (step === ITEMS.length) return renderSummary();
  renderSample();
}

/* ---------- Profile ---------- */
function renderProfile(){
  const ok = annot.english && annot.t2i;
  app.innerHTML = `
  <section class="card">
    <div class="prompt"><span class="lbl">Before you start</span><q>About you</q></div>
    <div class="field"><label class="f" for="aid">Annotator ID <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input type="text" id="aid" value="${annot.id}" autocomplete="off" placeholder="e.g. P07"></div>
    ${PROFILE.map(p=>`<div class="q"><h3>${p.label}</h3>${p.sub?`<p class="sub">${p.sub}</p>`:""}
      ${radios("p-"+p.key, p.opts, annot[p.key], "row", (v,l)=>l)}</div>`).join("")}
    <div class="nav"><button class="primary right" id="start" ${ok?"":"disabled"}>Start</button></div>
  </section>
  ${showLabels.checked?legend():""}`;
  document.getElementById("aid").oninput = e => annot.id = e.target.value;
  PROFILE.forEach(p => app.querySelectorAll(`input[name="p-${p.key}"]`).forEach(e => e.onchange = () => { annot[p.key]=e.value; render(); }));
  document.getElementById("start").onclick = () => { step = 0; render(); };
}

function legend(){
  const counts = {}; ITEMS.forEach(it => counts[it.cat]=(counts[it.cat]||0)+1);
  return `<section class="card"><div class="prompt"><span class="lbl">Sample categories in this pilot</span></div>
    <div class="legend">${Object.entries(CATS).map(([k,v])=>`<div><b class="cat-${k}">${k}</b><span>${v} · ${counts[k]} sample${counts[k]>1?"s":""}</span></div>`).join("")}</div></section>`;
}

/* ---------- Sample ---------- */
function renderSample(){
  const i = order[step], it = ITEMS[i], r = R[i];
  r.position = step + 1;
  const marking = r.unwanted === "yes";
  const ok = r.rating && r.unwanted && r.confidence;
  app.innerHTML = `
  <section class="card">
    ${showLabels.checked?`
    <div class="labels">
      <span class="tag cat cat-${it.cat}">${it.cat} · ${CATS[it.cat]}</span>
      <span class="tag"><i>sub</i>${it.sub}</span>
      <span class="tag"><i>theme</i>${it.theme}</span>
      <span class="tag"><i>id</i>${it.id}${it.pairedWith?` ↔ ${it.pairedWith}`:""}</span>
    </div>
    <p class="unm">Unmentioned content: <b>${it.unmentioned}</b></p>`:""}
    <div class="prompt"><span class="lbl">Sample ${step+1} / ${ITEMS.length} · Text</span><q>${it.prompt}</q></div>
    <div class="stim ${marking?"marking":""}" id="stim">${SCENES[it.scene]}
      ${marking?`<span class="hint">Click on what shouldn't be there</span>`:""}</div>

    <div class="q"><h3>1. How well does the image match the text?</h3>
      ${radios("rt", LIKERT, r.rating, "likert", (v,l)=>`<b>${v}</b>${l}`)}</div>

    <div class="q"><h3>2. Is there anything in the image that should <em>not</em> be there, given the text?</h3>
      ${radios("uw", [["no","No"],["yes","Yes"]], r.unwanted, "row", (v,l)=>l)}
      ${marking?`<div class="marks"><span>${r.marks.length} element${r.marks.length===1?"":"s"} marked</span>${r.marks.length?`<button class="link" id="clr">Clear</button>`:""}</div>`:""}</div>

    <div class="q"><h3>3. How sure are you about your answers?</h3>
      ${radios("cf", CONF, r.confidence, "row", (v,l)=>l)}</div>

    <div class="nav">
      <button id="prev">Back</button>
      <button class="primary" id="next" ${ok?"":"disabled"}>${step===ITEMS.length-1?"Finish":"Next"}</button>
    </div>
  </section>`;

  app.querySelectorAll('input[name="rt"]').forEach(e=>e.onchange=()=>{r.rating=+e.value;render()});
  app.querySelectorAll('input[name="cf"]').forEach(e=>e.onchange=()=>{r.confidence=e.value;render()});
  app.querySelectorAll('input[name="uw"]').forEach(e=>e.onchange=()=>{r.unwanted=e.value;if(e.value==="no")r.marks=[];render()});
  const clr = document.getElementById("clr"); if (clr) clr.onclick = () => { r.marks=[]; render(); };
  document.getElementById("prev").onclick = () => { step--; render(); };
  document.getElementById("next").onclick = () => { step++; render(); window.scrollTo({top:0}); };

  const svg = document.querySelector("#stim svg");
  r.marks.forEach(m => mark(svg, m));
  if (marking) svg.addEventListener("click", ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    r.marks.push({ x: Math.round(p.x), y: Math.round(p.y) }); render();
  });
}

function mark(svg, m){
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", m.x); c.setAttribute("cy", m.y); c.setAttribute("r", 14);
  c.setAttribute("fill", "none"); c.setAttribute("stroke", "#ff7a1a"); c.setAttribute("stroke-width", 4);
  svg.appendChild(c);
}

/* ---------- Summary ---------- */
function renderSummary(){
  const rows = [...R].sort((a,b)=>a.id.localeCompare(b.id));
  const payload = { annotator: annot, image_space: "400x260", responses: rows };
  const json = JSON.stringify(payload, null, 2);
  app.innerHTML = `
  <section class="card">
    <div class="prompt"><span class="lbl">Pilot complete</span><q>Thank you</q></div>
    <div class="tbl"><table>
      <thead><tr><th>ID</th><th>Category</th><th>Subcategory</th><th>Theme</th><th>Rating</th><th>Unwanted</th><th>Marks</th><th>Conf.</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${r.category}</td><td class="wrap">${r.subcategory}</td><td>${r.theme}</td><td>${r.rating}</td><td>${r.unwanted}</td><td>${r.marks.length}</td><td>${r.confidence}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="q"><h3>Responses (JSON)</h3><pre id="json">${json.replace(/</g,"&lt;")}</pre></div>
    <div class="nav"><button id="restart">Start over</button><button class="primary" id="copy">Copy JSON</button></div>
  </section>`;
  document.getElementById("restart").onclick = () => {
    R.forEach(r=>Object.assign(r,{rating:null,unwanted:null,marks:[],confidence:null,position:null}));
    Object.assign(annot,{id:"",english:null,t2i:null}); order = shuffle(order); step = -1; render();
  };
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText(json); e.target.textContent = "Copied"; }
    catch { const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("json")); s.removeAllRanges(); s.addRange(rg); e.target.textContent = "Text selected, press Ctrl+C"; }
  };
}

render();
</script>
