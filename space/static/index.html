<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image and Text Study</title>
<link rel="stylesheet" href="/static/vendor/jspsych-7.3.4.css">
<style>
/* Deliberately plain: system font, no boxes, one accent for selection and the main button. */
:root{
  --bg:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#dcdcdc; --hover:#f4f4f4;
  --accent:#2457a6; --accent-soft:#eef3fb; --warn:#b4530f; --bad:#b3261e;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161616; --ink:#ececec; --muted:#a0a0a0; --line:#3a3a3a; --hover:#212121;
  --accent:#8ab4f8; --accent-soft:#1e2a3d; --warn:#f0a868; --bad:#f2b8b5; color-scheme:dark}}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5}
.jspsych-display-element{font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink)}
.jspsych-content-wrapper{align-items:flex-start}
.jspsych-content{max-width:640px;width:100%;text-align:left;margin:0 auto;padding:32px 16px 64px;box-sizing:border-box}
.jspsych-content p{margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.eyebrow{font-size:13px;color:var(--muted)}
.bar{flex:1;max-width:200px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted)}
h1{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 8px}
.card{display:flex;flex-direction:column;gap:24px}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted)}
.prompt{display:flex;flex-direction:column;gap:2px}
.prompt .lbl{font-size:13px;color:var(--muted)}
.prompt q{font-size:22px;font-weight:600;line-height:1.3;quotes:none}
.prompt q.text{quotes:"“" "”"}  /* quotes only around the text being rated */
.stim{position:relative;border-radius:4px;overflow:hidden;line-height:0;user-select:none}
.stim img{width:100%;height:auto;display:block}
.stim.marking{cursor:crosshair;outline:2px solid var(--warn);outline-offset:-2px}
.stim .mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:4px solid #ff7a1a;border-radius:50%;box-sizing:border-box;pointer-events:none}
.stim .hint{position:absolute;left:8px;bottom:8px;line-height:1.3;background:var(--bg);color:var(--warn);font-size:13px;padding:4px 8px;border-radius:4px}
.style{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:-14px}
.style .tag{font-size:12px;font-weight:500;color:var(--ink);background:var(--hover);border-radius:4px;padding:2px 8px;white-space:nowrap}
.q{display:flex;flex-direction:column;gap:8px}
.q h3{font-size:16px;font-weight:600;margin:0}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .opt{flex:1 1 90px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted);line-height:1.25}
.opt label:hover{background:var(--hover)}
.row .opt label{min-height:42px;font-size:14px;color:var(--ink)}
.opt label b{font-size:17px;font-weight:600;color:var(--ink)}
.opt input:checked + label{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.marks{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.nav{display:flex;justify-content:flex-end;gap:10px}
.rank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rk{position:relative;display:block;padding:0;border:3px solid transparent;border-radius:6px;background:none;cursor:pointer;line-height:0;overflow:hidden}
.rk img{width:100%;height:auto;display:block;border-radius:3px}
.rk.on{border-color:var(--accent)}
.rk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rk .badge{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);font:600 16px/30px var(--font);text-align:center}
.fb{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:20px}
.fbcase{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:16px;align-items:start;margin-top:4px}
.fbtext{display:flex;flex-direction:column;gap:6px}
.fbtext .lbl{font-size:13px;color:var(--muted)}
.fbtext q{font-size:18px;font-weight:600;line-height:1.3;quotes:"“" "”"}
@media (max-width:480px){.fbcase{grid-template-columns:1fr}}
button.b{font:500 15px var(--font);border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button.b:disabled{opacity:.35;cursor:not-allowed}
button.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:13px;cursor:pointer}
.code{font:600 18px var(--mono);letter-spacing:.04em;padding:8px 12px;background:var(--hover);border-radius:4px;align-self:flex-start;user-select:all}
.err{color:var(--bad)}
@media (max-width:480px){.opt label{font-size:11px;min-height:60px}.prompt q{font-size:20px}}
</style>
</head>
<body>
<div id="jspsych-target"></div>
<noscript>This study needs JavaScript.</noscript>

<script src="/static/vendor/jspsych-7.3.4.min.js"></script>
<script>
const PT = jsPsychModule.ParameterType;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// How each dataset `visual_style` is named to participants; other values are shown as written.
const STYLES = { "svg-illustration": "Simple illustration", "photo": "Photograph", "ai-generated": "AI-generated image" };
const styleLabel = v => v ? STYLES[v] || v.replace(/[-_]/g, " ").replace(/^./, c => c.toUpperCase()) : "";
const radios = (name, opts, fmt) => opts.map(([v, l]) => `
  <div class="opt"><input type="radio" id="${name}-${v}" name="${name}" value="${v}"><label for="${name}-${v}">${fmt(v, l)}</label></div>`).join("");

/* ---------------------------------------------------------------- plugins */
class PagePlugin {
  static info = { name: "page", parameters: {
    html: { type: PT.HTML_STRING, default: "" }, button: { type: PT.STRING, default: "Continue" } } };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el, t) {
    const t0 = performance.now();
    el.innerHTML = `<div class="card">${t.html}<div class="nav"><button class="b primary" id="go">${t.button}</button></div></div>`;
    el.querySelector("#go").onclick = () => { el.innerHTML = ""; this.jsPsych.finishTrial({ trial_kind: "page", rt: Math.round(performance.now() - t0) }); };
  }
}

class ProfilePlugin {
  static info = { name: "profile", parameters: {} };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el) {
    const Q = [
      ["english", "How would you describe your English?", "", [["native","Native"],["fluent","Fluent"],["intermediate","Intermediate"]]],
      ["t2i", "How often do you use AI image generators?", "For example Midjourney, DALL·E, Stable Diffusion, Imagen.", [["never","Never"],["sometimes","A few times"],["regularly","Regularly"]]],
    ];
    el.innerHTML = `<div class="card"><div class="prompt"><span class="lbl">Before you start</span><q>About you</q></div>
      ${Q.map(([k, l, sub, o]) => `<div class="q"><h3>${l}</h3>${sub ? `<p class="muted" style="margin-top:-6px;font-size:13px">${sub}</p>` : ""}
        <div class="row" role="radiogroup">${radios(k, o, (v, x) => x)}</div></div>`).join("")}
      <div class="nav"><button class="b primary" id="go" disabled>Start</button></div></div>`;
    const ans = {};
    const go = el.querySelector("#go");
    Q.forEach(([k]) => el.querySelectorAll(`input[name="${k}"]`).forEach(i => i.onchange = () => {
      ans[k] = i.value; go.disabled = !Q.every(([q]) => ans[q]); }));
    go.onclick = () => { el.innerHTML = ""; this.jsPsych.finishTrial({ trial_kind: "profile", ...ans }); };
  }
}

class StimulusPlugin {
  static info = { name: "stimulus", parameters: {
    stim: { type: PT.OBJECT, default: undefined }, index: { type: PT.INT, default: 0 }, total: { type: PT.INT, default: 0 },
    practice: { type: PT.BOOL, default: false }, last: { type: PT.BOOL, default: false } } };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el, t) {
    const s = t.stim, t0 = performance.now();
    const r = { rating: null, unwanted: null, confidence: null, marks: [], rating_changes: 0, rt_first_rating: null };
    el.innerHTML = `
      ${t.practice ? `<div class="top"><span class="eyebrow">Practice · this one is not used, it is only to try the questions</span></div>`
                   : `<div class="top"><span class="eyebrow">Image ${t.index + 1} of ${t.total}</span><span class="bar"><i style="width:${100 * t.index / t.total}%"></i></span></div>`}
      <div class="card">
        <div class="prompt"><span class="lbl">Text</span><q class="text">${esc(s.prompt)}</q></div>
        ${s.visual_style ? `<div class="style"><span class="tag">${esc(styleLabel(s.visual_style))}</span>Judge what is shown, not the drawing style.</div>` : ""}
        <div class="stim" id="stim"><img src="${s.src || "/stimuli/" + encodeURIComponent(s.file_name)}" alt="" draggable="false"></div>
        <div class="q"><h3>1. How well does the image match the text?</h3>
          <div class="likert" role="radiogroup">${radios("rating", [[1,"Does not match"],[2,"Poorly"],[3,"Partly"],[4,"Mostly"],[5,"Fully matches"]], (v, l) => `<b>${v}</b>${l}`)}</div></div>
        <div class="q"><h3>2. Is there anything in the image that should <em>not</em> be there, given the text?</h3>
          <div class="row" role="radiogroup">${radios("unwanted", [["no","No"],["yes","Yes"]], (v, l) => l)}</div>
          <div class="marks" id="marks" hidden></div></div>
        <div class="q"><h3>3. How sure are you about your answers?</h3>
          <div class="row" role="radiogroup">${radios("confidence", [["low","Not sure"],["mid","Fairly sure"],["high","Very sure"]], (v, l) => l)}</div></div>
        <div class="nav"><button class="b primary" id="next" disabled>${t.practice ? "Start the study" : t.last ? "Submit my answers" : "Next"}</button></div>
      </div>`;
    window.scrollTo({ top: 0 });
    const stim = el.querySelector("#stim"), marksEl = el.querySelector("#marks"), next = el.querySelector("#next");
    const refresh = () => {
      const marking = r.unwanted === "yes";
      stim.classList.toggle("marking", marking);
      stim.querySelectorAll(".mk,.hint").forEach(n => n.remove());
      r.marks.forEach(m => { const d = document.createElement("div"); d.className = "mk"; d.style.left = (m.x * 100) + "%"; d.style.top = (m.y * 100) + "%"; stim.appendChild(d); });
      if (marking) {
        const h = document.createElement("span"); h.className = "hint"; h.textContent = "Click on what shouldn't be there"; stim.appendChild(h);
        marksEl.hidden = false;
        marksEl.innerHTML = r.marks.length ? `<span>${r.marks.length} element${r.marks.length === 1 ? "" : "s"} marked</span><button class="link" id="clr">Clear</button>`
                                           : `<span>Click on the image to mark at least one element.</span>`;
        const c = marksEl.querySelector("#clr"); if (c) c.onclick = () => { r.marks = []; refresh(); };
      } else marksEl.hidden = true;
      next.disabled = !(r.rating && r.unwanted && r.confidence) || (r.unwanted === "yes" && !r.marks.length);
    };
    el.querySelectorAll('input[name="rating"]').forEach(i => i.onchange = () => {
      if (r.rating !== null) r.rating_changes++; else r.rt_first_rating = Math.round(performance.now() - t0);
      r.rating = +i.value; refresh(); });
    el.querySelectorAll('input[name="unwanted"]').forEach(i => i.onchange = () => { r.unwanted = i.value; if (i.value === "no") r.marks = []; refresh(); });
    el.querySelectorAll('input[name="confidence"]').forEach(i => i.onchange = () => { r.confidence = i.value; refresh(); });
    stim.addEventListener("click", ev => {
      if (r.unwanted !== "yes") return;
      const b = stim.querySelector("img").getBoundingClientRect();
      const x = (ev.clientX - b.left) / b.width, y = (ev.clientY - b.top) / b.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      r.marks.push({ x: +x.toFixed(4), y: +y.toFixed(4) }); refresh();
    });
    next.onclick = () => {
      const data = { trial_kind: t.practice ? "practice" : "stimulus", position: t.index + 1, sample_id: s.sample_id, prompt: s.prompt,
        rating: r.rating, unwanted: r.unwanted, marks: r.marks, confidence: r.confidence,
        rating_changes: r.rating_changes,
        rt_first_rating: r.rt_first_rating, rt: Math.round(performance.now() - t0) };
      el.innerHTML = ""; this.jsPsych.finishTrial(data);
    };
  }
}

// Several images for one text: tap them from favourite to least favourite. Tapping a ranked image
// takes it out; the last one is placed automatically.
class RankingPlugin {
  static info = { name: "ranking", parameters: {
    set: { type: PT.OBJECT, default: undefined }, index: { type: PT.INT, default: 0 }, total: { type: PT.INT, default: 0 },
    last: { type: PT.BOOL, default: false } } };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el, t) {
    const r = t.set, t0 = performance.now();
    const shown = this.jsPsych.randomization.shuffle(r.images);
    let order = [], resets = 0;
    el.innerHTML = `
      <div class="top"><span class="eyebrow">Ranking ${t.index + 1} of ${t.total}</span><span class="bar"><i style="width:${100 * t.index / t.total}%"></i></span></div>
      <div class="card">
        <div class="prompt"><span class="lbl">Text</span><q class="text">${esc(r.prompt)}</q></div>
        ${r.visual_style ? `<div class="style"><span class="tag">${esc(styleLabel(r.visual_style))}</span>Judge what is shown, not the drawing style.</div>` : ""}
        <p>Which of these would you rather get from an image generator for this text? Tap them from your favourite to your least favourite.</p>
        <div class="rank">${shown.map(im => `<button type="button" class="rk" data-id="${esc(im.sample_id)}"><img src="/stimuli/${encodeURIComponent(im.file_name)}" alt="" draggable="false"><span class="badge" hidden></span></button>`).join("")}</div>
        <div class="marks" id="status"></div>
        <div class="nav"><button class="b" id="reset">Start over</button><button class="b primary" id="next" disabled>${t.last ? "Submit my answers" : "Next"}</button></div>
      </div>`;
    window.scrollTo({ top: 0 });
    const next = el.querySelector("#next"), status = el.querySelector("#status");
    const ordinal = n => ["first", "second", "third", "fourth"][n - 1] || `#${n}`;
    const refresh = () => {
      el.querySelectorAll(".rk").forEach(b => {
        const k = order.indexOf(b.dataset.id), badge = b.querySelector(".badge");
        badge.hidden = k < 0; badge.textContent = k + 1; b.classList.toggle("on", k >= 0);
        b.setAttribute("aria-label", k < 0 ? "Not ranked yet" : `Ranked ${k + 1}`);
      });
      status.textContent = order.length < shown.length ? `Tap the image you would put ${ordinal(order.length + 1)}.` : "Done. Tap an image to take it out, or Start over.";
      next.disabled = order.length !== shown.length;
    };
    el.querySelectorAll(".rk").forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      order = order.includes(id) ? order.filter(x => x !== id) : [...order, id];
      if (order.length === shown.length - 1) order.push(shown.find(im => !order.includes(im.sample_id)).sample_id);
      refresh();
    });
    el.querySelector("#reset").onclick = () => { if (order.length) resets++; order = []; refresh(); };
    next.onclick = () => {
      el.innerHTML = "";
      this.jsPsych.finishTrial({ trial_kind: "ranking", set_id: r.set_id, position: t.index + 1,
        shown: shown.map(im => im.sample_id), order, resets, rt: Math.round(performance.now() - t0) });
    };
    refresh();
  }
}

/* ---------------------------------------------------------------- run */
const jsPsych = initJsPsych({ display_element: "jspsych-target", on_finish: () => submit() });
const P = {
  prolific_pid: jsPsych.data.getURLVariable("PROLIFIC_PID") || null,
  study_id: jsPsych.data.getURLVariable("STUDY_ID") || null,
  prolific_session_id: jsPsych.data.getURLVariable("SESSION_ID") || null,
};
const target = document.getElementById("jspsych-target");
let SESSION = null;
// Leaving or reloading mid-study loses every answer, so the browser asks first.
const leaveGuard = e => { e.preventDefault(); e.returnValue = ""; };

async function submit() {
  const all = jsPsych.data.get();
  const profile = all.filter({ trial_kind: "profile" }).values()[0] || {};
  const payload = {
    session_id: SESSION.session_id, list_id: SESSION.list_id,
    participant: { ...P, english: profile.english, t2i: profile.t2i },
    trials: all.filter({ trial_kind: "stimulus" }).values().map(({ trial_kind, trial_type, trial_index, time_elapsed, internal_node_id, ...d }) => d),
    rankings: all.filter({ trial_kind: "ranking" }).values().map(({ trial_kind, trial_type, trial_index, time_elapsed, internal_node_id, ...d }) => d),
    total_time_ms: Math.round(all.last(1).values()[0].time_elapsed),
    client: { user_agent: navigator.userAgent, screen: `${screen.width}x${screen.height}`, viewport: `${innerWidth}x${innerHeight}`,
              language: navigator.language, finished_at: new Date().toISOString() },
  };
  const show = html => { target.innerHTML = `<div class="jspsych-content-wrapper"><div class="jspsych-content"><div class="card">${html}</div></div></div>`; };
  show(`<div class="prompt"><span class="lbl">Saving</span><q>One moment…</q></div>`);
  try {
    const res = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(res.status);
    const out = await res.json();
    removeEventListener("beforeunload", leaveGuard);
    // No automatic redirect: participants get time to read the feedback, then continue themselves.
    show(`<div class="prompt"><span class="lbl">Done</span><q>Thank you</q></div>
      <p>Your answers have been saved.</p>
      ${out.completion_code ? `<p>Your completion code:</p><div class="code">${esc(out.completion_code)}</div>` : ""}
      <div id="feedback" hidden></div>
      ${out.redirect ? `<div class="nav"><button class="b primary" id="toprolific">Back to Prolific</button></div>`
                     : `<p class="muted">You can close this page.</p>`}`);
    if (out.redirect) document.getElementById("toprolific").onclick = () => { location.href = out.redirect; };
    showFeedback();
  } catch (e) {
    show(`<div class="prompt"><span class="lbl">Not saved yet</span><q>Your answers could not be sent</q></div>
      <p class="err">Check your connection, then try again. Please do not close this page.</p>
      <div class="nav"><button class="b primary" id="retry">Try again</button></div>`);
    document.getElementById("retry").onclick = submit;
  }
}

// Shown only after the answers are saved, so it cannot change them. Worded as a comparison, never as a score.
async function showFeedback() {
  let fb = null;
  try {
    const res = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ session_id: SESSION.session_id, list_id: SESSION.list_id }) });
    if (res.ok) fb = (await res.json()).feedback;
  } catch (e) {}
  const el = document.getElementById("feedback");
  if (!fb || !el) return;
  const d = fb.mean_diff, pts = v => `${Math.abs(v).toFixed(1)} point${Math.abs(v).toFixed(1) === "1.0" ? "" : "s"}`;
  const tone = Math.abs(d) < 0.05 ? "On average, your ratings were the same as other participants’."
    : `On average, your ratings were ${pts(d)} ${d < 0 ? "lower" : "higher"} than other participants’.`;
  const m = fb.most_different;
  el.hidden = false;
  el.innerHTML = `<div class="fb">
    <div class="prompt"><span class="lbl">Your answers and others’</span></div>
    <p>${tone}</p>
    <p>On ${fb.n_close} of the ${fb.n_compared} images we could compare, your rating was within 1 point of the others’ average.</p>
    ${m ? `<div class="fbcase">
      <div class="stim"><img src="/stimuli/${encodeURIComponent(m.file_name)}" alt=""></div>
      <div class="fbtext">
        <span class="lbl">Where you differed most</span>
        <q>${esc(m.prompt)}</q>
        <p>You rated it <b>${m.rating}</b> out of 5. The other ${m.others_n} participants gave it <b>${m.others_mean.toFixed(1)}</b> on average.</p>
        <p class="muted">Neither answer is wrong: people read the same text differently, and these differences are what this study is about.</p>
      </div></div>` : ""}
  </div>`;
}

async function main() {
  try {
    const res = await fetch("/api/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(P) });
    if (!res.ok) throw new Error(res.status);
    SESSION = await res.json();
  } catch (e) {
    target.innerHTML = `<div class="jspsych-content-wrapper"><div class="jspsych-content"><div class="card"><div class="prompt"><span class="lbl">Error</span><q>The study could not start</q></div><p class="err">Reload the page in a minute. If it still fails, contact the researchers.</p></div></div></div>`;
    return;
  }
  // preload every image before the first trial
  const rankings = jsPsych.randomization.shuffle(SESSION.rankings || []);
  const files = [...SESSION.stimuli, ...rankings.flatMap(r => r.images)].map(s => s.file_name);
  await Promise.all([...new Set(files)].map(f => new Promise(ok => { const i = new Image(); i.onload = i.onerror = ok; i.src = "/stimuli/" + encodeURIComponent(f); })));

  const stims = jsPsych.randomization.shuffle(SESSION.stimuli);
  addEventListener("beforeunload", leaveGuard);
  const timeline = [
    { type: PagePlugin, button: "I agree, continue", html: `
      <div class="prompt"><span class="lbl">Research study · about ${Math.max(3, Math.round(stims.length * 0.4 + rankings.length * 0.5))} minutes</span><q>Does the image match the text?</q></div>
      <p>This study is part of academic research on how people judge images made by AI image generators. You will see ${stims.length} short texts, each with an image, and answer three quick questions about each.${rankings.length ? ` At the end, you will put a few images in order of preference (${rankings.length} short rankings).` : ""}</p>
      <ul class="muted">
        <li>Participation is voluntary and you can stop at any time by closing this page.</li>
        <li>We record your answers, response times and basic browser information. We do not collect your name or email.</li>
        <li>Anonymized answers may be published as a research dataset.</li>
        ${SESSION.contact ? `<li>Questions about this study: ${esc(SESSION.contact)}</li>` : ""}
      </ul>
      <p>By continuing, you agree to take part.</p>` },
    { type: ProfilePlugin },
    { type: PagePlugin, button: "Begin", html: `
      <div class="prompt"><span class="lbl">Instructions</span><q>How to answer</q></div>
      <p>Imagine you typed the text into an image generator and got this image back.</p>
      <ul>
        <li>Judge only <b>how well the image matches what the text asks for</b>, not how beautiful or realistic it is.</li>
        <li>If something in the image should not be there given the text, answer <b>Yes</b> to question 2 and click on it.</li>
        <li>There are no right or wrong answers. Go with your first impression.</li>
      </ul>
      <p class="muted">The first image is a practice round.</p>` },
    { type: StimulusPlugin, practice: true, stim: { sample_id: "practice", prompt: "a house", src: "/static/practice.svg", visual_style: "svg-illustration" } },
    ...stims.map((s, i) => ({ type: StimulusPlugin, stim: s, index: i, total: stims.length, last: !rankings.length && i === stims.length - 1 })),
    ...(rankings.length ? [{ type: PagePlugin, button: "Start", html: `
      <div class="prompt"><span class="lbl">Last part</span><q>Which image would you prefer?</q></div>
      <p>You will now see several images for the same text. Imagine you typed the text into an image generator and got all of them back.</p>
      <ul>
        <li>Tap the images in order, from the one you would most like to keep to the one you would least like.</li>
        <li>Go with your own preference. There are no right or wrong answers.</li>
      </ul>` }] : []),
    ...rankings.map((r, i) => ({ type: RankingPlugin, set: r, index: i, total: rankings.length, last: i === rankings.length - 1 })),
  ];
  await jsPsych.run(timeline);
}
main();
</script>
</body>
</html>
