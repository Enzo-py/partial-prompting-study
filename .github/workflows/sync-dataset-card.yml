name: Sync dataset card

# Uploads dataset/hub/ (card, taxonomy, annotation guidelines) to the stimuli dataset.
# It only adds or overwrites these files: images and parquet data on the Hub are never touched.
# Needs the repository secret HF_TOKEN (write access to the dataset).
# Optional repository variable HF_DATASET.

on:
  push:
    branches: [main]
    paths: ["dataset/hub/**", ".github/workflows/sync-dataset-card.yml"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: ${{ vars.HF_DATASET || 'Enzo-py/partial-prompting-ds' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Upload dataset/hub/ to the dataset
        run: |
          hf upload "$HF_DATASET" dataset/hub . --repo-type dataset \
            --commit-message "Sync card and taxonomy ${GITHUB_SHA::7} from GitHub"
